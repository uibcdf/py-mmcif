name: Build and upload conda packages

on:
  release:
    types: ['released', 'prereleased']

  workflow_dispatch:

jobs:
  conda_deployment_with_new_tag:
    name: Conda deployment of package with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      CONDA_NO_PLUGINS: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure submodules are present
        shell: bash
        run: |
          git submodule update --init --recursive

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: build
          condarc: |
            channels:
              - conda-forge
              - defaults
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Info conda
        shell: bash -l {0}
        run: |
          micromamba activate build
          micromamba info
          micromamba list

      - name: Build conda package
        shell: bash -l {0}
        working-directory: devtools/conda-build
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          micromamba activate build
          out_dir="$(mktemp -d -t compilation-XXXXXXXXXX)"
          echo "Building into: $out_dir"
          conda-build . \
            --no-anaconda-upload \
            --output-folder "$out_dir" \
            --package-format tar.bz2 \
            --python "$PYTHON_VERSION"
          package_path="$(find "$out_dir" -type f -name "*.tar.bz2" | head -n 1)"
          if [ -z "$package_path" ]; then
            echo "Conda build produced no package in $out_dir"
            exit 1
          fi
          echo "PACKAGE_PATH=$package_path" >> "$GITHUB_ENV"
          echo "Built package: $package_path"

      - name: Upload conda package
        shell: bash -l {0}
        working-directory: devtools/conda-build
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
        run: |
          set -euo pipefail
          micromamba activate build
          if [ -z "${PACKAGE_PATH:-}" ]; then
            echo "Missing PACKAGE_PATH from build step"
            exit 1
          fi
          anaconda upload --user uibcdf --label auto "$PACKAGE_PATH"
