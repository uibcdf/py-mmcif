name: Build, test, and upload conda package

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the tested package to the uibcdf channel
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build portable noarch package
    runs-on: ubuntu-latest
    env:
      CONDA_NO_PLUGINS: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: build
          condarc: |
            channels:
              - conda-forge
              - defaults
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Build package
        id: build
        shell: bash -el {0}
        working-directory: devtools/conda-build
        run: |
          set -euo pipefail
          output_directory="${RUNNER_TEMP}/conda-package"
          conda-build . \
            --no-anaconda-upload \
            --output-folder "${output_directory}" \
            --package-format tar.bz2
          package_path="$(find "${output_directory}" -type f -path '*/noarch/*.tar.bz2' | head -n 1)"
          if [[ -z "${package_path}" ]]; then
            echo "Conda build did not produce a noarch package" >&2
            exit 1
          fi
          echo "package_path=${package_path}" >> "${GITHUB_OUTPUT}"
          echo "channel_path=${output_directory}" >> "${GITHUB_OUTPUT}"

      - name: Preserve candidate package
        uses: actions/upload-artifact@v4
        with:
          name: py-mmcif-conda-candidate
          path: ${{ steps.build.outputs.channel_path }}
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test ${{ matrix.platform }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-64, linux-aarch64, osx-64, osx-arm64, win-64]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - platform: linux-64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: osx-64
            runner: macos-15-intel
          - platform: osx-arm64
            runner: macos-15
          - platform: win-64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: py-mmcif-conda-candidate
          path: ${{ runner.temp }}/candidate

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test
          condarc: |
            channels:
              - conda-forge
              - defaults
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python }}

      - name: Install and exercise the candidate
        shell: bash -el {0}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          package_path="$(find "${RUNNER_TEMP}/candidate" -type f -name '*.tar.bz2' | head -n 1)"
          if [[ -z "${package_path}" ]]; then
            echo "Downloaded artifact contains no conda package" >&2
            exit 1
          fi
          channel_uri="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())' "${RUNNER_TEMP}/candidate")"
          micromamba install --yes --override-channels \
            --channel "${channel_uri}" \
            --channel conda-forge \
            --channel defaults \
            py-mmcif
          python "${GITHUB_WORKSPACE}/devtools/scripts/check_portable_install.py" \
            "${GITHUB_WORKSPACE}/mmcif/tests/data"

  publish:
    name: Publish tested package
    needs: [build, test]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: py-mmcif-conda-candidate
          path: ${{ runner.temp }}/candidate

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: publish
          condarc: |
            channels:
              - conda-forge
              - defaults
            channel_priority: strict
          create-args: >-
            anaconda-client

      - name: Upload package
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
        run: |
          set -euo pipefail
          package_path="$(find "${RUNNER_TEMP}/candidate" -type f -name '*.tar.bz2' | head -n 1)"
          if [[ -z "${package_path}" ]]; then
            echo "Downloaded artifact contains no conda package" >&2
            exit 1
          fi
          anaconda upload --user uibcdf --label main "${package_path}"
